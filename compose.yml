services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: gcm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gcm
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcm -d gcm"]
      interval: 5s
      retries: 10
  app:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gcm:${POSTGRES_PASSWORD}@postgres:5432/gcm
      NODE_ENV: production
      MEDIA_ROOT: /app/.storage
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes: ["media_data:/app/.storage"]
volumes:
  postgres_data:
  media_data:
